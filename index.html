<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainify Connect - Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <script src="https://accounts.google.com/gsi/client" onload="initGoogleTokenClient()" async defer></script>
</head>

<body class="pb-24">

    <!-- Header -->
    <header
        class="p-6 border-b border-slate-800 bg-slate-900/50 sticky top-0 z-10 backdrop-blur-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-purple-400"><i class="fas fa-heartbeat mr-2"></i>Trainify Connect</h1>
            <p id="header-subtitle" onclick="checkAdminAccess()" class="text-slate-500 text-xs cursor-pointer">Versión
                PRO - Sincronización Activa</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="admin-indicator" class="hidden text-purple-400 animate-pulse text-[10px] font-bold">MODE ADMIN
            </div>
            <div id="cloud-status" class="text-slate-600">
                <i class="fas fa-cloud"></i>
            </div>
            <button onclick="toggleTimer()" class="bg-slate-800 p-2 rounded-lg text-blue-400 border border-slate-700">
                <i class="fas fa-clock"></i>
            </button>
        </div>
    </header>

    <!-- Floating Timer -->
    <div id="timer-box" class="fixed top-24 right-4 bg-blue-600 p-3 rounded-xl shadow-xl hidden z-20 animate-pulse">
        <span id="timer-display" class="font-mono font-bold">01:30</span>
    </div>

    <!-- Main Content -->
    <main class="p-4 space-y-6">

        <!-- VISTA ENTRENAMIENTO -->
        <div id="view-workout" class="space-y-6">
            <div class="flex justify-between overflow-x-auto gap-2 pb-2" id="category-tabs">
                <button onclick="changeCategory('superior')"
                    class="nav-tab px-4 py-2 rounded-lg bg-slate-800 text-sm whitespace-nowrap active"
                    id="tab-superior">Superior</button>
                <button onclick="changeCategory('inferior')"
                    class="nav-tab px-4 py-2 rounded-lg bg-slate-800 text-sm whitespace-nowrap"
                    id="tab-inferior">Inferior</button>
                <button onclick="changeCategory('espalda')"
                    class="nav-tab px-4 py-2 rounded-lg bg-slate-800 text-sm whitespace-nowrap"
                    id="tab-espalda">Espalda/Hombro</button>
            </div>
            <div id="exercise-list" class="space-y-4"></div>
        </div>

        <!-- VISTA NUTRICIÓN -->
        <div id="view-nutrition" class="hidden space-y-6">
            <div class="card-gradient p-6 rounded-2xl border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-blue-400 text-center">Calculadora de Macros</h2>
                <div class="space-y-4">
                    <input type="number" id="user-weight" placeholder="Peso (kg)"
                        class="w-full p-3 rounded input-log text-left">
                    <select id="user-goal" class="w-full p-3 rounded input-log text-left bg-slate-800">
                        <option value="recomp">Recomposición (Mantenimiento)</option>
                        <option value="cut">Definición (Déficit)</option>
                        <option value="bulk">Volumen (Superávit)</option>
                    </select>
                    <button onclick="calculateMacros()"
                        class="w-full py-3 bg-blue-600 rounded-xl font-bold uppercase">Calcular</button>
                </div>
            </div>
            <div id="macro-results" class="hidden grid grid-cols-2 gap-4"></div>
        </div>

        <!-- VISTA CONFIGURACIÓN -->
        <div id="view-config" class="hidden space-y-6">
            <!-- PANEL ADMIN (Solo visible para Admin) -->
            <div id="admin-panel"
                class="hidden card-gradient p-6 rounded-2xl border-2 border-purple-500/50 space-y-6 shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                <h2 class="text-xl font-bold text-purple-400 flex items-center gap-2">
                    <i class="fas fa-user-shield"></i> Panel de Control Maestro
                </h2>

                <!-- Gestión de Categorías (Tabs de la Imagen) -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest">Editar Categorías (Tabs)</h3>
                    <div id="admin-category-list" class="space-y-2"></div>
                    <div class="flex gap-2">
                        <input type="text" id="new-cat-name" placeholder="Nueva Categoría"
                            class="flex-1 p-2 rounded bg-slate-800 text-sm border border-slate-700">
                        <button onclick="addNewCategory()"
                            class="bg-purple-600 px-4 py-2 rounded font-bold text-sm text-white">AÑADIR</button>
                    </div>
                </div>

                <hr class="border-slate-800">

                <!-- Gestión de Ejercicios Maestros -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest text-center">Lista Maestra de
                        Ejercicios</h3>
                    <div class="flex gap-2">
                        <select id="admin-master-ex-cat"
                            class="bg-slate-800 p-2 rounded flex-1 border border-slate-700 text-xs mb-2"
                            onchange="renderAdminMasterExercises()"></select>
                    </div>
                    <div id="admin-master-ex-list" class="space-y-2 max-h-48 overflow-y-auto pr-1 mb-3"></div>
                    <div
                        class="flex flex-col gap-2 bg-slate-900 px-3 py-4 rounded-xl border border-slate-800 shadow-inner">
                        <input type="text" id="master-ex-name" placeholder="Nombre (ej: Press Banca)"
                            class="p-2 rounded bg-slate-800 text-xs border border-slate-700">
                        <input type="text" id="master-ex-note" placeholder="Nota técnica (opcional)"
                            class="p-2 rounded bg-slate-800 text-[10px] border border-slate-700">
                        <button onclick="addNewMasterExercise()"
                            class="bg-blue-600 py-2 rounded-lg font-bold text-xs text-white uppercase tracking-widest">Añadir
                            a Catálogo</button>
                    </div>
                </div>
            </div>
            <div class="card-gradient p-6 rounded-2xl border border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-green-400">Añadir Ejercicio</h2>
                <div class="space-y-3">
                    <input type="text" id="new-ex-name" placeholder="Nombre del ejercicio"
                        class="w-full p-3 rounded input-log text-left">
                    <select id="new-ex-cat" class="w-full p-3 rounded input-log text-left bg-slate-800">
                        <option value="superior">Tren Superior</option>
                        <option value="inferior">Tren Inferior</option>
                        <option value="espalda">Espalda/Hombro</option>
                    </select>
                    <button onclick="addExercise()"
                        class="w-full py-2 bg-green-600 rounded-lg font-bold">AÑADIR</button>
                </div>
            </div>

            <div class="card-gradient p-6 rounded-2xl border border-slate-700 text-center">
                <h2 class="text-xl font-bold mb-4 text-purple-400">Respaldo de Datos</h2>

                <div id="google-login-section" class="mb-6 p-4 bg-slate-900/50 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400 mb-3">Sincroniza automáticamente con Google Drive</p>
                    <button id="btn-login" onclick="handleAuthClick()"
                        class="w-full py-3 bg-white text-slate-900 rounded-xl font-bold flex items-center justify-center gap-3">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="Google"> Iniciar Sesión con
                        Google
                    </button>
                    <div id="user-info" class="hidden space-y-3">
                        <div class="flex items-center justify-between bg-slate-800 p-2 rounded-lg text-xs">
                            <span class="font-bold text-green-400"><i class="fas fa-check-circle mr-1"></i>
                                Conectado</span>
                            <button onclick="handleSignoutClick()" class="text-red-400 underline italic">Cerrar
                                sesión</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="syncToCloud()"
                                class="py-2 bg-blue-600 rounded-lg text-[10px] font-bold uppercase tracking-widest">Subir
                                a Nube</button>
                            <button onclick="loadFromCloud()"
                                class="py-2 bg-slate-700 rounded-lg text-[10px] font-bold uppercase tracking-widest text-slate-300">Bajar
                                de Nube</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportData()"
                        class="w-full py-3 bg-slate-800 border border-slate-600 rounded-xl flex items-center justify-center gap-2">
                        <i class="fas fa-file-download"></i> Descargar JSON
                    </button>
                    <label
                        class="w-full py-3 bg-slate-800 border border-slate-600 rounded-xl flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fas fa-file-upload"></i> Cargar JSON
                        <input type="file" id="import-file" class="hidden" onchange="importData(event)">
                    </label>
                    <button onclick="resetApp()" class="w-full py-2 text-red-500 text-xs mt-4 underline">Limpiar memoria
                        del teléfono</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-3 flex justify-around text-slate-400 z-30 shadow-2xl">
        <button onclick="switchTab('workout')" id="nav-workout" class="flex flex-col items-center text-blue-500">
            <i class="fas fa-list-ul"></i><span class="text-[10px] mt-1">Rutina</span>
        </button>
        <button onclick="switchTab('nutrition')" id="nav-nutrition" class="flex flex-col items-center">
            <i class="fas fa-utensils"></i><span class="text-[10px] mt-1">Nutrición</span>
        </button>
        <button onclick="switchTab('config')" id="nav-config" class="flex flex-col items-center">
            <i class="fas fa-cog"></i><span class="text-[10px] mt-1">Ajustes</span>
        </button>
    </nav>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
